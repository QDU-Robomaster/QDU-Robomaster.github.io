<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-labelledby="title desc">
  <title id="title">BMI088 coordinate system reference</title>
  <desc id="desc">A C board coordinate diagram using the USB connector direction as positive Y, right side as positive X, and upward as positive Z.</desc>
  <defs>
    <marker id="arrow-navy" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#0b2a63"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#c91919"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="900" height="470" fill="#fff"/>

  <g filter="url(#shadow)">
    <polygon points="205,270 660,270 760,335 305,335" fill="#d4d4d4" stroke="#111" stroke-width="3"/>
    <polygon points="305,335 760,335 760,390 305,390" fill="#c5c5c5" stroke="#111" stroke-width="3"/>
    <polygon points="660,270 760,335 760,390 660,325" fill="#9e9e9e" stroke="#111" stroke-width="3"/>
  </g>

  <rect x="315" y="282" width="88" height="28" rx="8" fill="#1f1f1f"/>
  <text x="359" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#111">USB</text>

  <circle cx="435" cy="290" r="12" fill="#111"/>
  <text x="435" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#111">BMI088</text>

  <line x1="480" y1="285" x2="610" y2="285" stroke="#111" stroke-width="3" marker-end="url(#arrow-gray)"/>
  <line x1="480" y1="285" x2="335" y2="185" stroke="#111" stroke-width="3" marker-end="url(#arrow-gray)"/>
  <line x1="480" y1="285" x2="480" y2="120" stroke="#111" stroke-width="3" marker-end="url(#arrow-gray)"/>

  <text x="623" y="292" font-family="Arial, sans-serif" font-size="26" fill="#111">+X</text>
  <text x="262" y="185" font-family="Arial, sans-serif" font-size="26" fill="#111">+Y</text>
  <text x="495" y="123" font-family="Arial, sans-serif" font-size="26" fill="#111">+Z</text>
  <text x="212" y="216" font-family="Arial, sans-serif" font-size="20" fill="#c91919">vehicle forward / USB</text>

  <path d="M628 250 C660 214 718 230 705 272" fill="none" stroke="#c91919" stroke-width="10" marker-end="url(#arrow-red)"/>
  <path d="M500 132 C548 106 597 127 581 168" fill="none" stroke="#c91919" stroke-width="10" marker-end="url(#arrow-red)"/>
  <path d="M279 199 C238 210 225 259 260 281" fill="none" stroke="#c91919" stroke-width="10" marker-end="url(#arrow-red)"/>

  <text x="704" y="232" font-family="Arial, sans-serif" font-size="24" fill="#c91919">omega x</text>
  <text x="592" y="124" font-family="Arial, sans-serif" font-size="24" fill="#c91919">omega z</text>
  <text x="170" y="267" font-family="Arial, sans-serif" font-size="24" fill="#c91919">omega y</text>

  <line x1="180" y1="70" x2="180" y2="195" stroke="#0b2a63" stroke-width="7" marker-end="url(#arrow-navy)"/>
  <text x="125" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0b2a63">force</text>
  <text x="125" y="101" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0b2a63">of gravity</text>

  <text x="470" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#111">
    Body frame: +Y forward, +X right, +Z up. Positive angular velocity follows the right-hand rule.
  </text>
</svg>
